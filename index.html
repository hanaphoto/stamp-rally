<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>スタンプラリー</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9333f">
<link rel="icon" href="images/icon.svg">
<style>
  :root{ --red:#d9333f; --bg:#fff8f5; --card:#ffffff; --text:#222; --muted:#777; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); }
  header{ background:var(--red); color:#fff; padding:18px 16px 14px; text-align:center; }
  header h1{ margin:0; font-size:22px; }
  header p{ margin:6px 0 0; font-size:14px; opacity:.92; }
  main{ max-width:560px; margin:0 auto; padding:16px; }
  .notice{ border-radius:12px; padding:12px 14px; margin:0 0 14px; font-size:15px; line-height:1.5; display:none; }
  .notice.show{ display:block; }
  .notice.got{ background:#e6f7e9; border:1px solid #58b368; }
  .notice.already{ background:#fff4d6; border:1px solid #e0b73c; }
  .notice.error{ background:#fde8e8; border:1px solid #e07a7a; }
  .notice.info{ background:#e8f1fd; border:1px solid #7aa7e0; }
  .progress{ text-align:center; font-size:18px; margin:6px 0 14px; }
  .progress strong{ font-size:26px; color:var(--red); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:12px; }
  .stamp{ background:var(--card); border:2px dashed #ccc; border-radius:50%; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; text-align:center; }
  .stamp .mark{ font-size:28px; line-height:1; color:#ccc; }
  .stamp .name{ font-size:13px; margin-top:6px; word-break:break-all; }
  .stamp .date{ font-size:10px; color:var(--muted); margin-top:3px; }
  .stamp.got{ border:2px solid var(--red); background:#fff0f0; }
  .stamp.got .mark{ color:var(--red); }
  .goal{ margin-top:18px; }
  .goal-item{ background:var(--card); border:1px solid #e3d9d5; border-radius:10px; padding:10px 14px; margin-bottom:8px; font-size:15px; display:flex; justify-content:space-between; }
  .goal-item.reached{ border-color:var(--red); color:var(--red); font-weight:bold; }
  #completeBox{ display:none; margin-top:20px; background:#fff; border:3px solid var(--red); border-radius:16px; padding:20px 16px; text-align:center; }
  #completeBox.show{ display:block; }
  #completeBox h2{ margin:0 0 8px; color:var(--red); font-size:24px; }
  #completeBox .code{ font-size:30px; letter-spacing:2px; font-weight:bold; background:#fff8e1; border:1px dashed #e0b73c; border-radius:10px; padding:10px; margin:12px 0; }
  #completeBox p{ margin:4px 0; font-size:14px; line-height:1.6; }
  #completeBox .now{ font-size:13px; color:var(--muted); }
  footer{ max-width:560px; margin:0 auto; padding:8px 16px 32px; text-align:center; }
  footer a{ color:var(--red); font-size:14px; }
  .reset-area{ margin-top:26px; }
  .reset-area button{ background:none; border:1px solid #bbb; color:#888; border-radius:8px; padding:8px 16px; font-size:13px; }
  #resetConfirm{ display:none; margin-top:12px; background:#fde8e8; border:1px solid #e07a7a; border-radius:10px; padding:14px; font-size:14px; line-height:1.6; }
  #resetConfirm.show{ display:block; }
  #resetConfirm button{ margin:8px 4px 0; padding:8px 14px; border-radius:8px; font-size:14px; }
  #resetDo{ background:var(--red); color:#fff; border:none; }
  #offlineReady{ display:none; text-align:center; font-size:12px; color:#58b368; margin-top:10px; }
  #offlineReady.show{ display:block; }
</style>
</head>
<body>
<header>
  <h1 id="appName">スタンプラリー</h1>
  <p id="eventName"></p>
</header>
<main>
  <div id="notice" class="notice"></div>
  <div class="progress"><strong id="gotCount">0</strong> / <span id="totalCount">0</span> 個</div>
  <div id="grid" class="grid"></div>
  <div id="goals" class="goal"></div>

  <div id="completeBox">
    <h2>コンプリート！</h2>
    <p id="completeEvent"></p>
    <p>達成日時：<span id="completeAt"></span></p>
    <div class="code" id="achievementCode"></div>
    <p>この画面をスタッフに見せてください。</p>
    <p class="now">現在時刻：<span id="nowTime"></span></p>
  </div>

  <div id="offlineReady">オフライン利用の準備ができました</div>

  <div class="reset-area">
    <button id="resetBtn" type="button">スタンプ帳をリセットする</button>
    <div id="resetConfirm">
      本当にリセットしますか？<br>取得したスタンプと達成情報がすべて消えます。
      <br>
      <button id="resetDo" type="button">リセットする</button>
      <button id="resetCancel" type="button">やめる</button>
    </div>
  </div>
</main>
<footer>
  <a href="manual.html">説明書はこちら</a>
</footer>

<script>
"use strict";
const ALPHABET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
let config = null;
let state = null;
let storageKey = null;

function loadState(){
  try{ return JSON.parse(localStorage.getItem(storageKey)) || null; }catch(e){ return null; }
}
function saveState(){
  try{ localStorage.setItem(storageKey, JSON.stringify(state)); }catch(e){}
}
function newState(){
  return { eventId: config.eventId, startedAt: null, stamps: {}, completedAt: null, achievementCode: null };
}
function generateCode(){
  const bytes = new Uint8Array(10);
  crypto.getRandomValues(bytes);
  let out = "";
  for(const b of bytes){
    if(b >= 224) continue; // 32で割り切れる範囲だけ使って偏りを避ける
    out += ALPHABET[b % 32];
    if(out.length === 8) break;
  }
  while(out.length < 8){ // 万一足りない場合の補充
    const extra = new Uint8Array(1); crypto.getRandomValues(extra);
    if(extra[0] < 224) out += ALPHABET[extra[0] % 32];
  }
  return out.slice(0,4) + "-" + out.slice(4,8);
}
function fmt(dt){
  const d = new Date(dt);
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "/" + p(d.getMonth()+1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function showNotice(kind, text){
  const el = document.getElementById("notice");
  el.className = "notice show " + kind;
  el.textContent = text;
}
function periodStatus(){
  if(!config.eventPeriod || !config.eventPeriod.enabled) return "in";
  const now = new Date();
  if(now < new Date(config.eventPeriod.start)) return "before";
  if(now > new Date(config.eventPeriod.end)) return "after";
  return "in";
}
function gotCount(){ return Object.keys(state.stamps).length; }

function tryStamp(){
  const params = new URLSearchParams(location.search);
  const s = params.get("s");
  const k = params.get("k");
  if(!s && !k) return;
  // URLのパラメータは処理後に消して、再読み込みでの再処理やURL共有を防ぐ
  history.replaceState(null, "", location.pathname);
  const spot = config.spots.find(x => x.id === s);
  if(!spot || spot.key !== k){
    showNotice("error", "スタンプを押せませんでした。タグ／QRコードをもう一度読み取ってください。");
    return;
  }
  const period = periodStatus();
  if(period === "before"){ showNotice("error", "このスタンプラリーはまだ始まっていません。"); return; }
  if(period === "after"){ showNotice("error", "このスタンプラリーは終了しました。"); return; }
  if(state.stamps[spot.id]){
    showNotice("already", "「" + spot.name + "」は取得済みです。");
    return;
  }
  if(!state.startedAt) state.startedAt = new Date().toISOString();
  state.stamps[spot.id] = new Date().toISOString();
  // ゴール判定（最大のゴールを達成したらコンプリート）
  const maxGoal = Math.max.apply(null, config.goals.map(g => g.count));
  if(gotCount() >= maxGoal && !state.completedAt){
    state.completedAt = new Date().toISOString();
    state.achievementCode = generateCode();
  }
  saveState();
  showNotice("got", "「" + spot.name + "」のスタンプを取得しました！");
}

function render(){
  document.getElementById("appName").textContent = config.appName || "スタンプラリー";
  document.title = config.appName || "スタンプラリー";
  document.getElementById("eventName").textContent = config.eventName || "";
  document.getElementById("gotCount").textContent = gotCount();
  document.getElementById("totalCount").textContent = config.spots.length;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for(const spot of config.spots){
    const gotAt = state.stamps[spot.id];
    const div = document.createElement("div");
    div.className = "stamp" + (gotAt ? " got" : "");
    div.innerHTML = "";
    const mark = document.createElement("div"); mark.className = "mark"; mark.textContent = gotAt ? "✓" : "・";
    const name = document.createElement("div"); name.className = "name"; name.textContent = spot.name;
    div.appendChild(mark); div.appendChild(name);
    if(gotAt){
      const date = document.createElement("div"); date.className = "date"; date.textContent = fmt(gotAt);
      div.appendChild(date);
    }
    grid.appendChild(div);
  }
  const goals = document.getElementById("goals");
  goals.innerHTML = "";
  for(const g of config.goals){
    const reached = gotCount() >= g.count;
    const div = document.createElement("div");
    div.className = "goal-item" + (reached ? " reached" : "");
    const left = document.createElement("span"); left.textContent = g.name + "（" + g.count + "個）";
    const right = document.createElement("span"); right.textContent = reached ? "達成！" : "あと" + (g.count - gotCount()) + "個";
    div.appendChild(left); div.appendChild(right);
    goals.appendChild(div);
  }
  const box = document.getElementById("completeBox");
  if(state.completedAt && state.achievementCode){
    box.className = "show"; box.id = "completeBox";
    document.getElementById("completeEvent").textContent = config.eventName || "";
    document.getElementById("completeAt").textContent = fmt(state.completedAt);
    document.getElementById("achievementCode").textContent = state.achievementCode;
    const tick = () => { document.getElementById("nowTime").textContent = fmt(new Date()); };
    tick(); setInterval(tick, 20000);
  }
  const period = periodStatus();
  if(period === "before") showNotice("info", "このスタンプラリーは " + fmt(config.eventPeriod.start) + " から始まります。");
  if(period === "after") showNotice("info", "このスタンプラリーは終了しました。取得したスタンプはそのまま見られます。");
}

async function init(){
  try{
    const res = await fetch("config.json", { cache: "no-cache" });
    config = await res.json();
  }catch(e){
    showNotice("error", "設定を読み込めませんでした。通信できる場所で開き直してください。");
    return;
  }
  storageKey = "stampRally_" + config.eventId;
  state = loadState() || newState();
  if(state.eventId !== config.eventId) state = newState();
  tryStamp();
  saveState();
  render();
}

document.getElementById("resetBtn").addEventListener("click", () => {
  document.getElementById("resetConfirm").className = "show";
  document.getElementById("resetConfirm").id = "resetConfirm";
});
document.getElementById("resetCancel").addEventListener("click", () => {
  const el = document.getElementById("resetConfirm"); el.className = ""; el.id = "resetConfirm";
});
document.getElementById("resetDo").addEventListener("click", () => {
  state = newState(); saveState();
  const el = document.getElementById("resetConfirm"); el.className = ""; el.id = "resetConfirm";
  render();
  showNotice("info", "リセットしました。");
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(async () => {
    try{
      await navigator.serviceWorker.ready;
      // キャッシュに本体が入っているか確認できたら準備完了を表示
      const keys = await caches.keys();
      if(keys.length) document.getElementById("offlineReady").className = "show";
    }catch(e){}
  }).catch(() => {});
}
init();
</script>
</body>
</html>
